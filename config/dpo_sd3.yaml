# ============================================================
# SD3 + ControlNet + RA Diffusion-DPO configuration
# Commands are documented in docs/DPO_SD3.md.
# ============================================================

# Reused by filtering when weather prompts are enabled.
weather_prompts:
  rain: "rainy scene, rain streaks on the image, wet surfaces, overcast sky"
  snow: "snowy scene, snowflakes covering the image, cold atmosphere, white noise"
  haze: "hazy scene, foggy atmosphere, low visibility, grayish tone"

# ==================== 1. Offline candidate generation ====================
candidate_generation:
  # Only model/inference defaults are reused from this evaluator config.
  eval_config: "./config/eval_sd3.yaml"
  # Offline preference data is built explicitly from the complete training sets.
  # Expected layout: <path>/train/{GT,LQ}/.
  dataset_rain: "/root/autodl-tmp/datasets/rain"
  dataset_snow: "/root/autodl-tmp/datasets/snow"
  dataset_haze: "/root/autodl-tmp/datasets/haze"
  splits: ["train"]
  output_dir: "/root/autodl-tmp/sd3/experiment/dpo_candidates"
  # Generate exactly eight candidates for every source image.
  num_candidates_per_image: 6
  # Per-candidate noise is generated directly from this base seed.
  seed: 20240805
  # Input scan limits. With sample_mode=head, take the first N images in
  # deterministic path order after merging each weather's train subdatasets.
  sample_mode: "head"
  rain_max_samples: 2000
  snow_max_samples: 1500
  haze_max_samples: 1000
  # Keep a group only when max(candidate PSNR) - min(candidate PSNR) reaches
  # its weather threshold. Values are in dB.
  weather_psnr_gap_thresholds:
    rain: 0.2
    snow: 0.62
    haze: 2.5
  # Applied independently to rain, snow, and haze after gap filtering.
  max_saved_groups_per_weather: 4000
  num_inference_steps: 30
  strength: 1.0
  controlnet_conditioning_scale: 1.0
  use_ra_fusion: true
  ra_fusion_scale: 0.1
  use_prompt: false
  # null uses paths in eval_config; set them here for one-off overrides.
  controlnet_model_path: null
  ra_fusion_path: null

# ==================== 2. Preference filtering ====================
preference_filter:
  candidate_metrics_path: "/root/autodl-tmp/sd3/experiment/dpo_candidates/per_candidate_metrics.csv"
  output_dir: "/root/autodl-tmp/sd3/experiment/dpo_preferences"
  pair_strategy: "best_vs_all"       # best_vs_all | best_vs_worst | all_pairs
  min_psnr_gap: 0.2
  # Initial values based on current rain/snow/haze gaps. Tune independently.
  weather_specific_thresholds:
    rain: 0.2
    snow: 0.5
    haze: 1.0
  max_psnr_gap: null
  # Maximum retained pairs per source image after sorting by PSNR gap.
  max_samples_per_pair: 3
  # null means unlimited; useful for balancing haze against rain/snow.
  max_pairs_per_weather: null
  shuffle: true
  random_seed: 42

# ==================== 3. Offline reward ====================
reward:
  # Higher total reward wins. Add metrics without changing filtering code.
  weights:
    psnr: 1.0
    # ssim: 0.0
    # lpips: 0.0
  directions:
    psnr: 1.0
    ssim: 1.0
    lpips: -1.0

# ==================== 4. DPO model ====================
model:
  pretrained_model_name_or_path: "stabilityai/stable-diffusion-3-medium-diffusers"
  controlnet_model_path: "/root/autodl-tmp/sd3/experiment/SD3ControlNet_RA_Joint/Joint-5000/controlnet"
  # Reference model is the immutable initial snapshot loaded from this path.
  ra_fusion_path: "/root/autodl-tmp/sd3/experiment/SD3ControlNet_RA_Joint/Joint-5000/ra_fusion"
  ra_fusion_scale: 0.1
  controlnet_conditioning_scale: 1.0
  revision: null
  variant: null

# ==================== 5. Diffusion-DPO training ====================
training:
  preference_manifest: "/root/autodl-tmp/sd3/experiment/dpo_preferences/preference_pairs.jsonl"
  output_dir: "/root/autodl-tmp/sd3/experiment/SD3_ControlNet_RA_DPO"
  # Three valid modes: RA only, ControlNet only, joint ControlNet+RA.
  # Setting both to false is rejected.
  train_controlnet: true
  train_ra_fusion: true
  resolution: 512
  train_batch_size: 1
  gradient_accumulation_steps: 4
  dataloader_num_workers: 0
  max_train_steps: 1000
  checkpointing_steps: 250
  beta: 0.1
  # ControlNet is larger and easier to destabilize; use a lower LR than RA.
  controlnet_learning_rate: 5.0e-8
  ra_fusion_learning_rate: 1.0e-7
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.01
  adam_epsilon: 1.0e-8
  lr_scheduler: "constant_with_warmup"
  lr_warmup_steps: 50
  mixed_precision: "bf16"
  upcast_vae: true
  gradient_checkpointing: true
  max_sequence_length: 77
  # Optional chosen reconstruction regularizer. Start at zero for pure DPO.
  sft_weight: 0.0
  weight_by_psnr_gap: false
  # Refuse legacy/mismatched preference data unless explicitly disabled.
  require_candidate_provenance: true
  report_to: null
  seed: 42

# ==================== 6. Inference/evaluation ====================
evaluation:
  eval_config: "./config/eval_sd3.yaml"
  output_dir: "/root/autodl-tmp/sd3/experiment/eval_sd3_dpo"
  # null selects DPO output when that component was trained, otherwise the base path.
  controlnet_model_path: null
  ra_fusion_path: null
  enable_fid: true
