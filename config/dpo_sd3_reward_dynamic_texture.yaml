# Dynamic-only spatial dual-objective experiment, schema sd3_dynamic_texture_v1.
# Standalone config. The weights below are experimental starting points, not validated optima.
weather_prompts:
  rain: "a clean, sharp, rain-free natural photograph with fine details"
  snow: "a clean, sharp, snow-free natural photograph with natural colors and fine details"
  haze: "a clear, sharp, haze-free natural photograph with natural colors and fine details"

reward:
  mode: dynamic_texture
  # A LOCAL Q gap, unrelated to the old quadratic dynamic reward margin.
  min_texture_q_gap: 0.05

spatial_dynamic:
  version: 1
  lambda_fidelity: 0.1       # Fixed coefficient of full-image RGB GT MSE.
  texture_strength: 2.0      # Set ONLY this to 0 for the spatial-weighting ablation.
  horizontal_flip_probability: 0.0
  mask:
    window: 7
    smooth_window: 3
    lower_quantile: 0.10
    upper_quantile: 0.99
    threshold: 0.35
    transition: 0.15
    gradient_floor: 0.0001
  patches:
    size: 224
    stride: 112
    max_patches: 4
    min_mean: 0.08
    min_coverage: 0.05
    max_iou: 0.5
  iqa_models:
    musiq: musiq-spaq
    clipiqa: clipiqa+
    nima: nima
  gt:
    interval: 1              # Every optimizer step; >1 explicitly makes GT supervision periodic.
    sigma_min: 0.05
    sigma_max: 0.70          # Sample actual scheduler entries, without changing the scheduler.

texture_scoring:
  input_csv: /root/autodl-tmp/sd3/experiment/dpo_candidates_m32_complete_groups/per_candidate_metrics_fr_nr.csv
  output_dir: /root/autodl-tmp/sd3/experiment/dpo_texture_scores_m32_v1
  visualize_groups: 3

# Existing candidates are reused, never regenerated by preparation/training.
candidate_generation:
  output_dir: /root/autodl-tmp/sd3/experiment/dpo_candidates_m32_complete_groups
  use_prompt: true

preference_filter:
  candidate_metrics_path: /root/autodl-tmp/sd3/experiment/dpo_texture_scores_m32_v1/per_candidate_texture.csv
  output_dir: /root/autodl-tmp/sd3/experiment/dpo_preferences_dynamic_texture_m32_v1
  pairs_per_group: 12
  min_psnr_gap: -0.15
  weather_specific_thresholds:
    rain: -0.15
    snow: -0.15
    haze: -0.15
  max_psnr_gap: null
  fidelity_constraints:
    max_dists_pair_degradation: 0.01
    baseline_mode: group_median
    baseline_psnr_tolerance: 0.50
    baseline_dists_tolerance: 0.02
  max_pairs_per_weather: null
  shuffle: true
  random_seed: 42

model:
  pretrained_model_name_or_path: stabilityai/stable-diffusion-3-medium-diffusers
  controlnet_model_path: /root/autodl-tmp/sd3/experiment/SD3ControlNet_RA_Joint/checkpoint-5000
  ra_fusion_path: /root/autodl-tmp/sd3/experiment/SD3ControlNet_RA_Joint/checkpoint-5000/ra_fusion
  ra_fusion_scale: 0.1
  controlnet_conditioning_scale: 1.0
  revision: null
  variant: null

tail_risk:
  enabled: false
  candidate_reward_file: null
  tail_quantile: 0.20
  lambda_tail: 1.0
  tail_deficit_max: 2.0
  eps: 0.00000001

training:
  preference_manifest: /root/autodl-tmp/sd3/experiment/dpo_preferences_dynamic_texture_m32_v1/preference_pairs.jsonl
  gt_source_manifest: /root/autodl-tmp/sd3/experiment/dpo_texture_scores_m32_v1/gt_sources.jsonl
  output_dir: /root/autodl-tmp/sd3/experiment/SD3_ControlNet_RA_DPO_Dynamic_Texture_M32_V1
  resume_from_checkpoint: null
  train_controlnet: true
  train_ra_fusion: true
  resolution: 512
  # RGB decoder backward adds activation memory; effective batch remains 8.
  train_batch_size: 2
  gradient_accumulation_steps: 4
  dataloader_num_workers: 4
  max_train_steps: 20000
  checkpointing_steps: 1000
  logging_steps: 10
  checkpoints_total_limit: 2
  controlnet_learning_rate: 0.000001
  ra_fusion_learning_rate: 0.000002
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.01
  adam_epsilon: 0.00000001
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 50
  mixed_precision: bf16
  upcast_vae: true
  gradient_checkpointing: true
  max_sequence_length: 77
  beta: 5000.0
  sft_weight: 0.0
  gt_flow_weight: 0.0
  gt_x0_l1_weight: 0.0
  weight_by_psnr_gap: false
  require_candidate_provenance: true
  report_to: tensorboard
  logging_dir: null
  seed: 42
  use_ema: true
  ema_decay: 0.9999
  ema_use_warmup: true
  ema_inv_gamma: 1.0
  ema_power: 0.75
  ema_update_after_step: 0
  ema_update_interval: 1
  ema_device: cpu
  validation_use_ema: true
  run_checkpoint_validation: true
  validation_before_training: false
  validation_eval_config: ./config/eval_sd3.yaml
  validation_num_samples_per_weather: 10
  validation_save_images: true
  validation_num_inference_steps: 30
  validation_guidance_scale: 1.0
  validation_strength: 1.0
  validation_seed: 42
  validation_lpips_net: alex
  validation_compute_iqa: true
  validation_iqa_device: cpu

evaluation:
  eval_config: ./config/eval_sd3.yaml
  output_dir: /root/autodl-tmp/sd3/experiment/eval_sd3_dpo_dynamic_texture_m32_v1
  controlnet_model_path: null
  ra_fusion_path: null
  use_ema: true
  num_inference_steps: 30
