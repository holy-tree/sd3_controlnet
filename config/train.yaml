# ============================================================
# SD3 ControlNet 训练配置 (镜像 controlnet_file/config/train.yaml 的字段命名)
# ============================================================
# 启动:
#   accelerate launch train_controlnet_sd3.py --config config/train.yaml
#   source /root/controlnet2/.venv/bin/activate
#
# 优先级: CLI 参数 > 本 YAML > argparse 默认值
#   - YAML 中值为 null 的字段会被跳过 (视为"未设置")
#   - 想在 CLI 临时覆盖, 直接传 --<flag> <value> 即可
# ============================================================

# ==================== 模型路径 ====================
# SD3 基础模型 (gated, 需 hf auth login) 或本地路径
pretrained_model_name_or_path: "stabilityai/stable-diffusion-3-medium-diffusers"

# ControlNet 初始化权重来源 (二选一):
#   1) controlnet_model_name_or_path: 加载已有 SD3 ControlNet 权重
#   2) 不填: 从 SD3 transformer 初始化 (SD3ControlNetModel.from_transformer)
controlnet_model_name_or_path: "/root/autodl-tmp/sd3/experiment/SD3ControlNet_RA_Joint/Joint-5000/controlnet"

# SD3 ControlNet 的 conditioning 额外通道数 (默认 0, 与 SD3 标准接口一致)
num_extra_conditioning_channels: 0

# HF revision / variant (fp16 等量化版本)
revision: null
variant: null

# ==================== 输出与缓存 ====================
output_dir: "/root/autodl-tmp/sd3/experiment/SD3ControlNet_RA_Prompt_Joint-5000"
cache_dir: null

# 接续训练 (从 checkpoint 恢复 optimizer / scheduler / global_step):
#   null      = 不接续, 从头训
#   "latest"  = 自动选 output_dir 里最新的 checkpoint
#   "/path/to/checkpoint-N" = 指定具体 checkpoint
resume_from_checkpoint:  null

# ==================== 数据集 (源项目布局, 与 --dataset_root 配合) ====================
# 数据集根目录, 结构: {dataset_root}/{weather}/{split}/{GT,LQ}/
dataset_root: "/root/autodl-tmp/datasets2/train"

# 参与训练的天气类型与划分
weather_types: ["rain", "snow", "haze"]
splits: ["train"]

# 每个天气类型使用的样本数 (None 表示不限制; 也可填 0/-1)
rain_num: null
snow_num: null
haze_num: null

# ==================== 文本 prompt (天气感知) ====================
# 是否启用天气 prompt (与源 train.yaml 一致)
use_prompt: true
prompt_ratio: 1.0

# 自定义天气 prompt (YAML 直接写 dict, 比 CLI 字符串更清晰)
weather_prompts:
  rain: "a clean, sharp, rain-free natural photograph with fine details"
  snow: "a clean, sharp, snow-free natural photograph with fine details"
  haze: "a clear, sharp, haze-free natural photograph with natural colors and fine details"

# proportion_empty_prompts 在 --dataset_root 模式下会被强制设为 0 (天气 prompt 已在 dataset 解析)
proportion_empty_prompts: 0

# 训练样本截断 (用于 debug; null = 不截断)
max_train_samples: null

# ==================== 分辨率与 batch ====================
resolution: 512
train_batch_size: 8
gradient_accumulation_steps: 1
dataloader_num_workers: 0

# ==================== 训练步数 ====================
num_train_epochs: 1
max_train_steps: 5000
checkpointing_steps: 1000
# 最多保存几个 checkpoint (旧的会被自动删除以节省磁盘)
checkpoints_total_limit: 3

# ==================== 优化器与梯度 ====================
learning_rate: 1.0e-6
scale_lr: false

# AdamW 参数
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.01
adam_epsilon: 1.0e-8
max_grad_norm: 1.0

# 8-bit Adam (bitsandbytes)
use_8bit_adam: false

# ==================== LR Scheduler ====================
lr_scheduler: "constant_with_warmup"   # linear / cosine / cosine_with_restarts / polynomial / constant / constant_with_warmup
lr_warmup_steps: 500
lr_num_cycles: 1                       # 仅 cosine_with_restarts 生效
lr_power: 1.0                          # 仅 polynomial 生效

# ==================== Flow Matching (SD3 专用) ====================
# 加权采样策略, 影响 timestep 分布
weighting_scheme: "logit_normal"       # sigma_sqrt / logit_normal / mode / cosmap
logit_mean: 0.0
logit_std: 1.0
mode_scale: 1.29

# 已改为直接监督 raw velocity；保留字段仅用于旧配置兼容。
precondition_outputs: 0

# ==================== Transformer LoRA (SD3 主干) ====================
# 在 SD3 Transformer Attention 上插入 LoRA, 配合 ControlNet 联合训练.
# 不需要 LoRA 时把 use_transformer_lora 置 0, 训练脚本会跳过所有相关逻辑.
use_transformer_lora: 0                 # 第一阶段仅训练 RA；已有 LoRA 时可改为 1 并填写路径
train_transformer_lora: 0              # 第一阶段冻结 LoRA，只归因于 RA Fusion
transformer_lora_model_path: null       # 可填已有 transformer_lora 目录
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.0
# 目标模块: SD3 JointTransformerBlock 的 self-attn 含 attn.to_q / to_k / to_v / to_out.0
# (Attention.to_out 是 ModuleList, to_out.0 为 Linear). 也可追加:
#   "add_q_proj", "add_k_proj", "add_v_proj", "to_add_out"  (文本 context 分支)
lora_target_modules: ["to_q", "to_k", "to_v", "to_out.0"]
# LoRA 学习率. 强烈建议远低于 ControlNet 的 learning_rate, 例如 1e-6 ~ 5e-6.
lora_learning_rate: 1.0e-6

# ==================== RA-inspired ControlNet Fusion ====================
# 从已有 Joint-5000 warm-start，联合对齐 ControlNet、RA 和目标域 prompt。
train_controlnet: 1
use_ra_fusion: 1
ra_fusion_interval: 4
ra_fusion_hidden_dim: 256
ra_fusion_num_res_blocks: 2
ra_fusion_kernel_size: 3
ra_fusion_learning_rate: 5.0e-7
ra_fusion_scale: 0.1                    # 限制 RA 增量，避免在多步采样中压过冻结主干
ra_fusion_stabilize: 1                  # 对递归 condition、timestep 和输出做无参数归一化
ra_degradation_enabled: 1               # P1: 从 LQ latent 预测全局退化向量 g
ra_degradation_hidden_dim: 64            # LQ latent encoder 的中间通道数
ra_degradation_global_dim: 128           # 全局退化向量 g 的维度
ra_weather_loss_weight: 0.01             # 辅助损失总量控制在 restoration loss 的约 10%-20%
ra_severity_loss_weight: 0.01            # 连续强度回归；target 在每种天气训练集内归一化
ra_spatial_loss_weight: 0.01             # M 的 32x32 soft degradation map 监督
ra_aux_smooth_l1_beta: 0.1               # severity/spatial 共用的 Smooth L1 beta
ra_spatial_focus_weight: 2.0             # 1 + weight*M_gt，避免稀疏雨雪被背景淹没
ra_spatial_top_fraction: 0.1             # 每个16x16 cell取响应最高10%的均值
ra_spatial_mean_weight: 0.5              # M_gt = 50% cell mean + 50% cell top-k mean
ra_degradation_stats_path: "/root/autodl-tmp/datasets2/manifests/degradation_stats.json"
ra_spatial_enabled: 1                    # 将空间退化图 M 注入 LQ condition tokens
ra_deformable_enabled: 1                 # 对 M 使用可学习偏移的局部采样
ra_deformable_kernel_size: 3             # 每个位置采样 3x3=9 个点
ra_deformable_max_offset: 1.0            # 每个采样点最多额外偏移 1 个 token 网格
ra_diagnostics_steps: 100               # 定期记录每个 RA block 的 delta/main RMS 比值
ra_fusion_model_path: "/root/autodl-tmp/sd3/experiment/SD3ControlNet_RA_Joint/Joint-5000/ra_fusion"              # 仅继续已有 RA 权重时填写；新训练保持 null

# T5 text encoder 最大序列长度
max_sequence_length: 77

# 重建/感知/边缘损失权重 (RGB 域, 替换旧 latent L1 / 频域 L1)
# pred_x0 由 raw velocity 重建，因此不依赖 precondition_outputs。
#   loss = loss_mse (flow matching)
#        + latent_l1_weight          * loss_latent  # latent x0 L1 reconstruction
#        + pixel_charbonnier_weight * loss_pixel   # RGB Charbonnier 像素重建
#        + edge_loss_weight         * loss_edge    # Sobel 边缘 L1 (RGB 域)
#        + lpips_weight             * loss_lpips   # 感知损失 (需 VAE.decode, 较重)
#
# 各重建损失均按 (1 - sigma) 在样本维加权, 自动侧重低噪声 timestep.
# VAE.decode 由 --lpips_interval 控制频率.
latent_l1_weight: 0.2                   # 第二阶段建议从 0.05 开始
pixel_charbonnier_weight: 0.0            # RA 稳定后再逐项启用图像域损失
edge_loss_weight: 0.0
lpips_weight: 0.0                       # PSNR 敏感任务建议 ≤0.02
lpips_interval: 4                      # 每 N 步算一次图像域损失, 其余步置 0
image_loss_start_step: 1000             # 避免 zero-init RA 的首次更新经过 VAE decoder backward
image_loss_batch_size: 1                # RGB loss 仅解码每卡前1个样本；latent/flow仍使用完整batch
lpips_net: "alex"                      # alex=快, vgg=准

# dataset.map(compute_embeddings_fn) 的 batch_size (预计算 prompt embeddings 用)
dataset_preprocess_batch_size: 1000

# ==================== 精度与显存 ====================
# no / fp16 / bf16 (fp16 配 GradScaler, bf16 跳过; SD3 推荐 bf16)
mixed_precision: "bf16"

# 是否 upcast VAE 到 fp32。更稳定但显存更高；先保留 true，验证后再尝试 bf16。
upcast_vae: true
# 三项均可能改变执行路径，默认关闭；逐项验证 PSNR 与峰值显存后再启用。
vae_gradient_checkpointing: false
vae_slicing: false
vae_tiling: false

# 梯度检查点 (用时间换显存)
gradient_checkpointing: true

# TF32 (Ampere+)
allow_tf32: false

# Optimizer zero_grad(set_to_none=True)
set_grads_to_none: false

# ==================== 日志与 Tracker ====================
logging_dir: "logs"
report_to: "tensorboard"               # tensorboard / wandb / comet_ml / all
tracker_project_name: "train_controlnet_SD3"

# seed (null = 随机)
seed: null

# ==================== 验证 (按 step 跑 pipeline 出图, SD3 官方 log_validation) ====================
validation_prompt: null
validation_image: null
num_validation_images: 1
validation_steps: 100

# ==================== 按 step 评估 PSNR/SSIM (移植自源项目 run_epoch_validation) ====================
run_validation: true                  # 默认关闭 (与源 train.yaml:165 一致)
run_validation_steps: 1000              # 每 N step 跑一次 (0 = 禁用)
validation_num_samples: 4               # 每种天气采样数
validation_inference_steps: 30          # pipeline 推理步数
validation_guidance_scale: 1.5          # 恢复任务使用低 CFG, 减少生成先验干扰
validation_negative_prompt: null
validation_use_image: 1                 # 使用 LQ latent 作为去噪起点
validation_strength: 1.0                # 有效起始噪声强度, 建议 0.2~0.6
validation_use_rss: 0                   # 保持现有验证曲线口径；RSS 消融时改为 1
validation_rss_weight: 0.01
validation_rss_threshold: 0.8

# ==================== Hub 推送 (HF) ====================
push_to_hub: false
hub_token: null
hub_model_id: null

# ==================== 保留旧字段 (HF imagefolder 兼容, 不与 --dataset_root 同用) ====================
# 想用 HF datasets (fill50k / metadata.jsonl) 时启用下面, 并把 --dataset_root 留空
dataset_name: null
dataset_config_name: null
train_data_dir: null
image_column: "image"
conditioning_image_column: "conditioning_image"
caption_column: "text"
