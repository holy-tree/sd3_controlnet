# python -m utils.evaluate_sd3 --config ./config/eval_sd3.yaml
# ==================== 模型与输出 ====================
# SD3 基础模型 (gated, 需 `hf auth login`)
# 也可改为本地路径, 如 D:/models/stable-diffusion-3-medium-diffusers
pretrained_model_name_or_path: "stabilityai/stable-diffusion-3-medium-diffusers"

# 训练好的 SD3 ControlNet 权重路径
# 支持三种结构 (与源 evaluate.py 兼容):
#   1) <path>/controlnet/config.json
#   2) <path>/config.json
#   3) <path>/checkpoint-N/controlnet/config.json  (accelerate save_state 输出)
controlnet_model_path: "/root/autodl-tmp/sd3/experiment/SD3ControlNet/checkpoint-90000/controlnet"
# null 时自动查找 controlnet checkpoint 同级的 transformer_lora/；
# 也可显式填写，例如 "./experiment/SD3ControlNet/checkpoint-50000/transformer_lora"。
transformer_lora_path: null
load_transformer_lora: false            # 第一阶段单独评估 RA，不混入 LoRA
# RA Fusion 训练完成后改为 true；null 时自动查找 checkpoint 同级 ra_fusion/。
use_ra_fusion: false
ra_fusion_path: null
# 可覆盖 checkpoint 保存的 RA 输出尺度。排查色块时依次测试 0.0 / 0.01 / 0.1 / 1.0。
ra_fusion_scale: null

# 评估结果输出目录
output_dir: "/root/autodl-tmp/sd3/experiment/eval_sd3"

# ==================== 数据集配置 ====================
# 各天气类型的 test 集根目录 (相互独立)
# 与源 config/eval.yaml 完全相同的 key 命名, 直接可平迁
dataset_rain: "/root/autodl-tmp/datasets/rain"
dataset_snow: "/root/autodl-tmp/datasets/snow"
dataset_haze: "/root/autodl-tmp/datasets/haze"
# 也支持 dataset_root + weather 子目录的方式:
# dataset_root: "D:/Projects/pycharm/WeaFU-main/dataprocess"
# 待评估的天气类型
weather_types: ["rain", "snow", "haze"]
# 评估时使用 test 划分
splits: ["test"]

# ==================== 推理参数 ====================
# SD3 训练配置默认 512 (与源项目一致)
resolution: 512
num_inference_steps: 30
# 图像恢复任务下, 高 CFG 会放大 SD3 的生成先验, 压坏纹理位置与色彩.
# 建议范围 1.0~3.0, 1.0~1.5 是"低先验"模式, 更接近确定性恢复.
guidance_scale: 1.5
# 负向 prompt: 图像恢复任务下会过度惩罚纹理, 与 GT 偏离反而扣分.
# 留 null 表示不传 negative_prompt (CFG 退化为单分支引导).
negative_prompt: null
mixed_precision: "bf16"
seed: 42

# ==================== image-conditioned init (img2img) ====================
# strength: 起始噪声强度. 1.0=纯噪声 (默认 t2i ControlNet, 自由生成);
#          <1.0=用 LQ 作为 image-conditioned init, 在 LQ latent 上加少量噪声起步去噪,
#          大幅提升 PSNR 与纹理位置一致性. 建议范围 0.2~0.6.
strength: 1.0

# ==================== Restoration Sampling Strategy (RSS) ====================
# 每次 scheduler.step 后，在高 sigma 阶段将生成 latent 轻微拉向 LQ latent。
# rain/snow/haze 会把退化也带回输出，因此从较小 weight 开始做消融。
use_rss: false
rss_weight: 0.01
rss_threshold: 0.8

# 推理时使用的 prompt (留空则全部使用空 prompt)
use_prompt: false
prompt_ratio: 0.2

# ==================== 评估参数 ====================
# === 评估采样数 (用于计算指标, 默认 0 = 使用全部 test 集) ===
# 与源 config/eval.yaml 同语义:
#   0  或负数: 不限制, 跑完整 test 集 (默认, 指标统计更准确)
#   正数:      仅跑前 N 张 (用于快速调试)
max_samples_per_weather: 0
# 截断模式 (与 max_samples_per_weather 配合)
#   head   : 取前 N 张, 可复现 (默认, 推荐)
#   random : 随机抽 N 张, 可复现 (若 yaml 设 seed)
sample_mode: head

# 评估 batch 大小 (一次 pipeline 推几张 LQ)
# SD3 ControlNet 比 SD2 重得多, 默认 1 更稳; 显存允许时调到 2~4
# 注意: SD3 pipeline 同时跑多张时显存叠加明显, 推荐先从 1 开始
eval_batch_size: 4

# === 可视化保存数 (与评估解耦, 与源 eval.yaml 完全一致) ===
# 控制每个天气类别下保存多少组预测图像 (pred.png / lq.png / gt.png)
# 评估始终跑完整 test 集 (受 max_samples_per_weather 控制),
# 但只保存其中一部分用于人工查看
#
#   0  : 不保存任何预测图 (只算指标)
#   -1 : 保存全部评估样本的图 (默认)
#   正数: 仅保存前 N 张的图
#
# 例如:
#   rain_num: 10  -> rain 保存前 10 张
#   snow_num: -1  -> snow 全部保存
#   haze_num: 0   -> haze 不保存
rain_num: 10
snow_num: 10
haze_num: 10

# 是否启用预测图保存 (全局开关, false 则全部不保存, 覆盖每天气设置)
save_predictions: true

# ==================== LPIPS 配置 ====================
# LPIPS 使用的 backbone: 'alex' | 'vgg' (默认 alex, 更快)
lpips_net: "alex"

# ==================== FID 配置 ====================
# 是否启用 FID 指标计算 (InceptionV3 特征分布距离, 越低越好)
# 首次运行时会自动下载 InceptionV3 权重 (~100MB) 到 ~/.cache/torch/hub/checkpoints/
# 计算耗时较长, 调试时可关闭
enable_fid: true
# FID 内部 batch size (一次喂 InceptionV3 的图片数, 控制峰值显存)
# 推荐: 32 (512x512 图约 1.5GB 峰值); OOM 时降到 8 或 4
fid_batch_size: 32
